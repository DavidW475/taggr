name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v1.4.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a semantic version tag like v1.4.2"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            # A tag with a pre-release part is published as a pre-release and
            # does not move the "latest" image tag.
            if [[ "$TAG" == *-* ]]; then
              echo "prerelease=true"
            else
              echo "prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      # Nothing is published from a tag whose tests do not pass.
      - name: Test
        run: go test -race ./...

  binaries:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [prepare, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          binary=taggr
          if [ "$GOOS" = windows ]; then
            binary=taggr.exe
          fi
          mkdir -p build
          go build -trimpath \
            -ldflags="-s -w \
              -X github.com/DavidW475/taggr/cmd.buildVersion=${VERSION} \
              -X github.com/DavidW475/taggr/cmd.buildCommit=${GITHUB_SHA:0:7}" \
            -o "build/${binary}" .

      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          name="taggr_${VERSION}_${GOOS}_${GOARCH}"
          cp README.md build/
          if [ "$GOOS" = windows ]; then
            (cd build && zip -q "../${name}.zip" taggr.exe README.md)
          else
            tar -czf "${name}.tar.gz" -C build taggr README.md
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: taggr_*
          if-no-files-found: error
          retention-days: 7

  image:
    name: Image
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish release
    needs: [prepare, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: archive-*
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum taggr_* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          # A re-run replaces the assets instead of failing on the existing release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          image_ref="${IMAGE,,}:${VERSION}"
          notes=$(cat <<NOTES
          \`\`\`sh
          go install github.com/DavidW475/taggr@${TAG}
          docker run --rm ${image_ref} next
          \`\`\`

          Linux and Windows binaries for amd64 and arm64 are attached; \`SHA256SUMS\`
          holds their checksums.
          NOTES
          )

          args=(--title "$TAG" --notes "$notes" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi

          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" "${args[@]}"
