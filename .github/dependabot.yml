# Keeps the go modules, the actions used by the workflows and the base images of
# both Dockerfiles up to date.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for the lot rather than one per module.
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # The taggr image.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # The self-hosted Azure Pipelines agent.
  - package-ecosystem: docker
    directory: /docker/agent
    schedule:
      interval: weekly
